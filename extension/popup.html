<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iCreatePDF - Free Offline PDF Tools</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-wrapper">
    <div class="popup-card">
      <!-- Header -->
      <header class="header">
        <div class="brand">
          <div class="logo-wrap">
            <img src="icons/icon48.png" alt="iCreatePDF" class="logo">
          </div>
          <div class="brand-text">
            <div class="title-row">
              <h1 class="brand-name">iCreate<span>PDF</span></h1>
              <span class="badge-private">100% PRIVATE</span>
            </div>
            <p class="tagline">132+ Browser-Powered PDF Tools</p>
          </div>
        </div>
      </header>

      <!-- Instant Search Filter -->
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="toolSearch" placeholder="Search PDF tools (e.g. merge, compress)..." autocomplete="off"
          spellcheck="false" />
        <button id="clearSearch" class="clear-btn" aria-label="Clear search" style="display: none;">&times;</button>
      </div>

      <!-- Quick Tools Grid -->
      <div class="section-title">POPULAR TOOLS</div>
      <section class="tools-grid" id="toolsGrid">
        <!-- Merge PDF -->
        <a href="https://icreatepdf.com/en/tools/merge-pdf" class="tool-card" data-name="merge combine join">
          <div class="icon-wrap icon-rose">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2" />
              <polyline points="2 17 12 22 22 17" />
              <polyline points="2 12 12 17 22 12" />
            </svg>
          </div>
          <span class="label">Merge</span>
        </a>

        <!-- Split PDF -->
        <a href="https://icreatepdf.com/en/tools/split-pdf" class="tool-card" data-name="split extract separate cut">
          <div class="icon-wrap icon-orange">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <circle cx="6" cy="6" r="3" />
              <circle cx="6" cy="18" r="3" />
              <line x1="20" y1="4" x2="8.12" y2="15.88" />
              <line x1="14.47" y1="14.48" x2="20" y2="20" />
              <line x1="8.12" y1="8.12" x2="12" y2="12" />
            </svg>
          </div>
          <span class="label">Split</span>
        </a>

        <!-- Compress PDF -->
        <a href="https://icreatepdf.com/en/tools/compress-pdf" class="tool-card"
          data-name="compress reduce size shrink">
          <div class="icon-wrap icon-emerald">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <polyline points="4 14 10 14 10 20" />
              <polyline points="20 10 14 10 14 4" />
              <line x1="14" y1="10" x2="21" y2="3" />
              <line x1="3" y1="21" x2="10" y2="14" />
            </svg>
          </div>
          <span class="label">Compress</span>
        </a>

        <!-- Edit PDF -->
        <a href="https://icreatepdf.com/en/tools/edit-pdf" class="tool-card" data-name="edit modify annotate text">
          <div class="icon-wrap icon-blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M4 13.5V4a2 2 0 0 1 2-2h8.5L20 7.5V20a2 2 0 0 1-2 2h-5.5" />
              <polyline points="14 2 14 8 20 8" />
              <path d="M10.42 12.61a2.1 2.1 0 1 1 2.97 2.97L7.95 21 4 22l1-3.95 5.42-5.44Z" />
            </svg>
          </div>
          <span class="label">Edit</span>
        </a>

        <!-- JPG to PDF -->
        <a href="https://icreatepdf.com/en/tools/jpg-to-pdf" class="tool-card"
          data-name="jpg to pdf image photo convert">
          <div class="icon-wrap icon-purple">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
              <circle cx="9" cy="9" r="2" />
              <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
            </svg>
          </div>
          <span class="label">JPG→PDF</span>
        </a>

        <!-- PDF to JPG -->
        <a href="https://icreatepdf.com/en/tools/pdf-to-jpg" class="tool-card" data-name="pdf to jpg extract image">
          <div class="icon-wrap icon-amber">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
              <polyline points="14 2 14 8 20 8" />
              <circle cx="10" cy="13" r="1.5" />
              <path d="m20 17-2.5-2.5a1.4 1.4 0 0 0-2 0L10 20" />
            </svg>
          </div>
          <span class="label">PDF→JPG</span>
        </a>

        <!-- Sign PDF -->
        <a href="https://icreatepdf.com/en/tools/sign-pdf" class="tool-card" data-name="sign signature fill">
          <div class="icon-wrap icon-pink">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="m12 19 7-7 3 3-7 7-3-3z" />
              <path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
              <path d="m2 2 7.586 7.586" />
              <circle cx="11" cy="11" r="2" />
            </svg>
          </div>
          <span class="label">Sign</span>
        </a>

        <!-- Protect PDF -->
        <a href="https://icreatepdf.com/en/tools/encrypt-pdf" class="tool-card"
          data-name="protect encrypt password lock secure">
          <div class="icon-wrap icon-cyan">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </div>
          <span class="label">Protect</span>
        </a>

        <!-- Workflow Builder -->
        <a href="https://icreatepdf.com/en/workflow" class="tool-card" data-name="workflow builder pipeline flow">
          <div class="icon-wrap icon-indigo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <line x1="6" x2="6" y1="3" y2="15" />
              <circle cx="18" cy="6" r="3" />
              <circle cx="6" cy="18" r="3" />
              <path d="M18 9a9 9 0 0 1-9 9" />
            </svg>
          </div>
          <span class="label">Workflow</span>
        </a>

        <!-- OCR PDF -->
        <a href="https://icreatepdf.com/en/tools/ocr-pdf" class="tool-card" data-name="ocr text recognition scan">
          <div class="icon-wrap icon-teal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M3 7V5a2 2 0 0 1 2-2h2" />
              <path d="M17 3h2a2 2 0 0 1 2 2v2" />
              <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
              <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
              <path d="M7 8h10" />
              <path d="M7 12h10" />
              <path d="M7 16h6" />
            </svg>
          </div>
          <span class="label">OCR PDF</span>
        </a>

        <!-- Word to PDF -->
        <a href="https://icreatepdf.com/en/tools/word-to-pdf" class="tool-card"
          data-name="word docx doc to pdf convert">
          <div class="icon-wrap icon-blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" x2="8" y1="13" y2="13" />
              <line x1="16" x2="8" y1="17" y2="17" />
              <line x1="10" x2="8" y1="9" y2="9" />
            </svg>
          </div>
          <span class="label">Word→PDF</span>
        </a>

        <!-- Organize PDF -->
        <a href="https://icreatepdf.com/en/tools/organize-pdf" class="tool-card"
          data-name="organize reorder delete rotate pages">
          <div class="icon-wrap icon-violet">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <rect width="7" height="9" x="3" y="3" rx="1" />
              <rect width="7" height="5" x="14" y="3" rx="1" />
              <rect width="7" height="9" x="14" y="12" rx="1" />
              <rect width="7" height="5" x="3" y="16" rx="1" />
            </svg>
          </div>
          <span class="label">Organize</span>
        </a>
      </section>

      <div id="noResults" class="no-results" style="display: none;">
        No tools found matching your search.
      </div>

      <!-- Primary CTA Button -->
      <a href="https://icreatepdf.com/en/tools" class="open-btn" id="openSite">
        <span>Explore All 132+ Tools</span>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>

      <!-- Footer Privacy Guarantee -->
      <footer class="footer">
        <div class="privacy-badge">
          <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            <polyline points="9 12 11 14 15 10" />
          </svg>
          <span>Runs 100% locally in your browser. Zero uploads.</span>
        </div>
      </footer>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
