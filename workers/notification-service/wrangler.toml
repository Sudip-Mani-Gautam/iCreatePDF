name = "icreatepdf-notifications"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
FIREBASE_PROJECT_ID = "icreatepdf"
ALLOWED_ORIGIN = "https://icreatepdf.com"

# Cloudflare D1 Database Binding
# Create your database using: wrangler d1 create icreatepdf-notifications-db
# Then replace database_id below with the ID output by the command
[[d1_databases]]
binding = "DB"
database_name = "icreatepdf-notifications-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
