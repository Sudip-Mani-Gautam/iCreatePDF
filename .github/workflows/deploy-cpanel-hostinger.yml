name: Deploy to cPanel / Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "production-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Fast Deploy to Hostinger
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🚀 Build Static Export (Next.js)
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: ''

      - name: 📂 Verify Build & Prepare Archive
        run: |
          test -d out || (echo "Error: out directory not found" && exit 1)
          test -f out/.htaccess || cp .htaccess out/.htaccess
          echo "Compressing build into high-speed deploy.zip..."
          cd out
          zip -q -r ../deploy.zip .
          cd ..
          ls -lh deploy.zip
          cat << 'EOF' > deploy-extract.php
          <?php
          $token = isset($_GET['token']) ? $_GET['token'] : '';
          if ($token !== 'icreatepdf_deploy_secret_2026') {
              http_response_code(403);
              die("FORBIDDEN");
          }
          if (!file_exists('deploy.zip')) {
              http_response_code(404);
              die("DEPLOY_ZIP_NOT_FOUND");
          }
          $zip = new ZipArchive;
          if ($zip->open('deploy.zip') === TRUE) {
              $zip->extractTo(__DIR__);
              $zip->close();
              @unlink('deploy.zip');
              @unlink(__FILE__);
              echo "DEPLOY_SUCCESS";
          } else {
              http_response_code(500);
              echo "EXTRACT_FAILED";
          }
          EOF

      - name: 🌐 Upload & Extract on Hostinger (Blazing Fast)
        run: node scripts/deploy-zip.mjs
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || '' }}
