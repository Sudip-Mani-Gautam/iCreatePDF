name: Deploy to cPanel / Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "production-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & FTP Deploy to Hostinger/cPanel
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🚀 Build Static Export (Next.js)
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: ''

      - name: 📂 Verify Build & .htaccess
        run: |
          test -d out || (echo "Error: out directory not found" && exit 1)
          test -f out/.htaccess || cp .htaccess out/.htaccess
          echo "Build completed successfully. Files ready for upload:"
          ls -la out/ | head -n 20

      - name: 🌐 Deploy to Hostinger / cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          dangerous-clean-slate: false
