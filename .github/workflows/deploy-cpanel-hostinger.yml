name: Deploy to cPanel / Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "production-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & FTP Deploy to Hostinger/cPanel
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🚀 Build Static Export (Next.js)
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: ''

      - name: 📂 Verify Build & .htaccess
        run: |
          test -d out || (echo "Error: out directory not found" && exit 1)
          test -f out/.htaccess || cp .htaccess out/.htaccess
          echo "Build completed successfully. Total files:"
          find out -type f | wc -l

      - name: 🌐 Deploy to Hostinger via Resilient FTP Script
        run: node scripts/deploy-ftp.mjs
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || '' }}
